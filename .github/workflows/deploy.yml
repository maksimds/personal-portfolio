# Publishes the site to dmaksimoff.com after every push to main: builds the site once, runs the same
# checks as `npm test` on that build, then hands the very same build to GitHub Pages. If a check fails,
# nothing is published and the live site stays as it was. Other branches are checked by checks.yml instead.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab, to publish again without a push

permissions:
  contents: read

# One deploy at a time. A push made while one is running waits for it instead of cutting it off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history: the sitemap's dates come from it

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Astro and the check tools
        run: npm ci

      # Astro keeps the images it has resized in node_modules/.astro. Reusing them from the last build
      # saves about a minute; a new or changed image is still resized as usual.
      - name: Reuse resized images from the last build
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: astro-cache-${{ runner.os }}-

      - name: Build the site
        run: npm run build

      - name: Check the HTML is valid
        run: npm run test:html

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Check links, files and animations in a browser
        run: npm run test:browser

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Packs up dist/ (CNAME included) for GitHub Pages. Only reached when every check passed.
      - name: Hand the checked site to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
          include-hidden-files: true

  deploy:
    needs: build           # a failed check never reaches the live site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write         # to publish the site
      id-token: write      # to prove to GitHub Pages that this workflow is the one publishing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
