# Runs the site's checks on GitHub after every push to a branch other than main, so a broken page shows
# up as a red ✗ next to the commit instead of on the live site. A pull request shows the result of its
# branch's last push, so pull requests don't start a second run. The same checks run on your Mac with
# `npm test`. Pushes to main are checked by deploy.yml, which runs these same checks before publishing,
# so they aren't run twice there.
name: Site checks

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history: the sitemap's dates come from it

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Astro and the check tools
        run: npm ci

      # Astro keeps the images it has resized in node_modules/.astro: reusing them saves about a minute
      - name: Reuse resized images from the last build
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: astro-cache-${{ runner.os }}-

      - name: Build the site
        run: npm run build

      - name: Check the HTML is valid
        run: npm run test:html

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Check links, files and animations in a browser
        run: npm run test:browser

      # When something fails: a report with a screenshot and a step-by-step trace of each failed check,
      # downloadable from the run's page on the Actions tab.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
